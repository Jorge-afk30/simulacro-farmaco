const EX=["Proteinuria >3,5 g/día, hipercolesterolemia y edema/derrame configuran síndrome nefrótico.","La fiebre del COVID-19 es viral: los pirógenos son endógenos (citocinas); las enterotoxinas son pirógenos bacterianos.","HTA, anemia, azoemia y riñones hipotróficos tras 6 meses indican enfermedad renal crónica.","El cólico lumbar que irradia a la ingle es típico de urolitiasis.","En el nefrótico hay hipoalbuminemia, no hiperalbuminemia.","La tríada nefrítica es hematuria, hipertensión arterial y proteinuria.","NTA es parenquimatosa (2), obstrucción urinaria es postrenal (3) y menor perfusión es prerrenal (1): 2, 3, 1.","La HBP obstruye la salida de orina: causa postrenal; las demás son prerrenales.","El oxalato de calcio forma la mayor parte de los cálculos renales.","Las ondas f (línea de base irregular sin ondas P) son propias de la fibrilación auricular.","La trombosis sobre una placa de ateroma complicada es la causa más frecuente de IAM.","Con IRA y oliguria hay hiperpotasemia: ondas T picudas en el EKG.","ST elevado en DII, DIII y aVF indica IAM con elevación de ST (transmural) de pared inferior.","La placa estable tiene cápsula fibrosa gruesa y núcleo lipídico pequeño, por eso se rompe menos.","Secuencia: lesión inicial, estría grasa, fase intermedia, placa de ateroma y placa fibroateromatosa.","La compensación es la vasoconstricción (simpático y SRAA), no la vasodilatación.","El agua corporal total es cercana al 50 % en la mujer adulta; en el lactante es mayor y cambia con la edad.","Dolor precordial, hipotensión y frialdad por falla de bomba: shock cardiogénico.","El shock se clasifica en hipovolémico, distributivo, obstructivo y cardiogénico.","La angina típica cumple los tres criterios: dolor opresivo, desencadenado por esfuerzo y que cede con reposo o nitratos.","La HTA se asocia a activación simpática, no parasimpática.","La angina inestable aumenta con el tiempo y no cede al reposo.","El distributivo es vasodilatación con volumen normal (sepsis, anafilaxia, neurogénico).","ST supra y ondas Q en DI y aVL corresponden a pared lateral.","La reentrada es el mecanismo más frecuente de las taquiarritmias.","En la fibrilación auricular no hay onda P; hay ondas f.","HTA grado 1 (MINSA): PAS 140-159 y/o PAD 90-99 mmHg.","La reacción antígeno-anticuerpo es shock anafiláctico (distributivo), no séptico.","Disnea con pequeños esfuerzos es clase III de la NYHA (en reposo sería IV).","En el lupus el daño es glomerular/intersticial: IRA parenquimatosa.","En la prerrenal el parénquima está indemne y revierte al restaurar el flujo.","En la ERC disminuye la eritropoyetina que produce el riñón.","Proteinuria >3,5 g/día es del síndrome nefrótico, no del nefrítico.","La matriz orgánica del cálculo es mayormente proteica; decir que es 70 % carbohidratos es lo falso.","La fibrosis se debe a filtración de proteínas, proliferación celular y acumulación de matriz; no a menos sustancias vasoactivas.","La hipoalbuminemia estimula la síntesis hepática de lipoproteínas, causa de la hiperlipidemia y los xantomas.","Una evolución de meses con uso crónico de AINEs orienta a enfermedad renal crónica.","El enfisema es dilatación anormal permanente de los espacios aéreos con destrucción alveolar.","El asa con volúmenes pequeños y flujo conservado es patrón restrictivo.","Asma y enfisema tienen patrón obstructivo (VEF1/CVF disminuido).","La hipoventilación alveolar con retención de CO2 es insuficiencia respiratoria tipo II.","Si la hipoxemia no corrige con O2, la causa es shunt.","La PaCO2 normal es 35-45 mmHg.","Con D(A-a)O2 normal e hipercapnia la causa es hipoventilación.","Mayor elastancia y menor complianza es patrón restrictivo: VEF1/CVF normal o aumentado.","PaO2/FiO2 entre 100 y 200 es moderada (200-300 leve; ≤100 severa).","pH 7,47 con HCO3 32 es alcalosis metabólica (por pérdidas gástricas).","pH 7,25 con HCO3 16 y pCO2 bajo es acidosis metabólica compensada.","Tiffeneau = VEF1/CVF × 100 = 3/5 × 100 = 60 %.","Berlín exige inicio ≤1 semana, opacidades bilaterales, PaO2/FiO2 baja y descartar falla cardíaca; unilaterales no es criterio.","Causas de hipoxemia: V/Q, shunt, difusión, hipoventilación y baja FiO2; la hiperventilación no.","Atelectasia: tipo III; hipoventilación: tipo II; hipoxemia: tipo I; shock: tipo IV.","La inhalación de tóxicos es lesión pulmonar directa; sepsis, trauma y pancreatitis son indirectas.","pH bajo con PaCO2 70 elevada es acidosis respiratoria.","La debilidad de los músculos inspiratorios limita la expansión pulmonar (restrictivo); las demás opciones son obstructivas.","La CRF es el volumen que queda en los pulmones al final de una espiración normal.","Fumador con tos crónica, disnea progresiva y sibilancias con espiración prolongada: EPOC.","En la fiebre, las citocinas actúan sobre el hipotálamo y se produce prostaglandina E2.","Disnea, crepitantes, ingurgitación yugular y edema: insuficiencia cardiaca.","En hipoxia se activa la glucólisis anaerobia y la glucogenólisis; cae la fosforilación oxidativa.","La pancreatitis produce necrosis grasa enzimática por lipasas.","La reducción de tamaño por menor perfusión es atrofia.","La apoptosis no provoca inflamación adyacente.","En alergias estacionales aumentan los eosinófilos.","El aumento de presión oncótica capilar retiene líquido en el capilar y no causa edema.","Na 119 sin edemas ni deshidratación: hiponatremia hipoosmolar euvolémica (tipo SIADH).","Edema, proteinuria masiva y respuesta a corticoides: enfermedad de cambios mínimos.","Tras faringitis estreptocócica, la GN postestreptocócica cursa con ASLO elevada.","Un cálculo visible en la radiografía es lo más probable de calcio.","A las 24 h del infarto aparece necrosis coagulativa con infiltrado de neutrófilos.","En la prerrenal el riñón retiene sodio: FeNa <1 %.","La estenosis de la arteria renal causa HTA secundaria por activación del SRAA.","Aplastamiento, CPK elevada y oliguria: rabdomiólisis con daño tubular por mioglobina.","En el cardiogénico hay PVC elevada y RVS elevada.","Todas las fases finales del shock terminan en mala oxigenación celular.","El síndrome nefrítico postestreptocócico se debe a depósito de inmunocomplejos.","La descendente anterior es la arteria que más se ocluye en el IAM.","Fumador con roncantes y sibilantes: EPOC, obstructivo no reversible.","En la neumonía hay alvéolos llenos de exudado que se perfunden sin ventilarse (efecto shunt).","La troponina es el marcador más específico para confirmar IAM.","En fibrilación ventricular se indica desfibrilación inmediata junto con RCP.","Fiebre, odinofagia, exudado amigdalino y petequias palatinas: faringoamigdalitis estreptocócica.","Dolor lumbar tipo cólico irradiado y hematuria microscópica: nefrolitiasis.","Sibilancias bilaterales con síntomas catarrales en niña pequeña: bronquiolitis.","Edema y orina oscura tras faringoamigdalitis: GN por estreptococo beta-hemolítico del grupo A.","PAS ≥140 con PAD <90 es hipertensión sistólica aislada.","El péptido natriurético auricular aumenta la excreción de sodio y agua.","La hipovolemia (causa prerrenal) es la principal causa de injuria renal aguda.","ERC: FG <60 mL/min/1,73 m2 durante al menos 3 meses.","La sepsis es causa de shock distributivo.","ST elevado y ondas Q en II, III y aVF: IAM de pared inferior.","Na 119 sin edemas ni deshidratación: hiponatremia hipoosmolar euvolémica (tipo SIADH).","PAM = (PAS + 2×PAD)/3 = (140 + 160)/3 = 100 mmHg."];
